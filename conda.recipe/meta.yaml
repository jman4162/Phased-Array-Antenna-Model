{% set version = "1.4.0" %}

package:
  name: phased-array-modeling
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/p/phased-array-modeling/phased_array_modeling-{{ version }}.tar.gz
  sha256: 24929053e2803e34a685ab9218e9b8923c4873fada23f37b36f9ed335f4b55b2

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=61.0
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=1.20.0
    - matplotlib-base >=3.5.0
    - scipy >=1.7.0

test:
  imports:
    - phased_array
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/jman4162/Phased-Array-Antenna-Model
  summary: Comprehensive Python library for phased array antenna modeling and visualization
  doc_url: https://phased-array-antenna-model.readthedocs.io/
  dev_url: https://github.com/jman4162/Phased-Array-Antenna-Model
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jman4162
