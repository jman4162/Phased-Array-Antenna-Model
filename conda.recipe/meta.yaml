{% set version = "1.8.0" %}
{% set python_min = "3.10" %}

package:
  name: phased-array-modeling
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/p/phased-array-modeling/phased_array_modeling-{{ version }}.tar.gz
  # Refresh on each release: curl -sL <url above> | shasum -a 256
  sha256: 26f0e1d248b82c2e4154c3def1e04e1aea08c7885810a35f3db0ea6d64c1317c

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=77.0
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=1.21.3
    - matplotlib-base >=3.5.0
    - scipy >=1.7.2

test:
  imports:
    - phased_array
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/jman4162/Phased-Array-Antenna-Model
  summary: Comprehensive Python library for phased array antenna modeling and visualization
  doc_url: https://phased-array-antenna-model.readthedocs.io/
  dev_url: https://github.com/jman4162/Phased-Array-Antenna-Model
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jman4162
