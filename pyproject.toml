[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phased-array-modeling"
version = "1.6.0"
description = "Comprehensive Python library for phased array antenna modeling and visualization"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "John Hodge", email = "jah70@vt.edu"}
]
keywords = [
    "phased array",
    "antenna",
    "beamforming",
    "radar",
    "electromagnetics",
    "array factor",
    "radiation pattern"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21.3",
    "matplotlib>=3.5.0",
    "scipy>=1.7.2",
]

[project.optional-dependencies]
plotting = [
    "plotly>=5.0.0",
]
full = [
    "plotly>=5.0.0",
    "seaborn>=0.11.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "plotly>=5.0.0",
    "seaborn>=0.11.0",
    "ruff>=0.6.0",
    "mypy>=1.10",
]
docs = [
    "sphinx>=7.0.0",
    "pydata-sphinx-theme>=0.14.0",
    "sphinx-copybutton>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/jman4162/Phased-Array-Antenna-Model"
Documentation = "https://phased-array-antenna-model.readthedocs.io/"
Repository = "https://github.com/jman4162/Phased-Array-Antenna-Model"
Issues = "https://github.com/jman4162/Phased-Array-Antenna-Model/issues"

[tool.setuptools.packages.find]
include = ["phased_array*"]

[tool.setuptools.package-data]
phased_array = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
extend-exclude = ["build", "dist", "docs/_build"]

[tool.ruff.lint]
# Pyflakes plus syntax errors; formatting is left to isort and authors
select = ["E9", "F"]

[tool.mypy]
ignore_missing_imports = true
files = ["phased_array"]

