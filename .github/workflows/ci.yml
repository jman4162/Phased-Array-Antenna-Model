name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short -m "not docs"

      - name: Run tests with coverage
        if: matrix.python-version == '3.11'
        run: |
          pytest tests/ -m "not docs" --cov=phased_array --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  deps:
    # Exercise the declared minimums, NumPy 1.x, and modern NumPy 2.x
    # explicitly instead of relying on the default dependency resolution.
    name: deps (py${{ matrix.python-version }}, ${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            label: "oldest supported"
            numpy: "numpy==1.21.3"
            scipy: "scipy==1.7.2"
            matplotlib: "matplotlib==3.5.0"
          - python-version: "3.11"
            label: "numpy 1.x"
            numpy: "numpy==1.26.4"
            scipy: "scipy==1.11.4"
            matplotlib: "matplotlib==3.8.4"
          - python-version: "3.12"
            label: "numpy 2.x"
            numpy: "numpy>=2.4"
            scipy: "scipy>=1.14"
            matplotlib: "matplotlib>=3.9"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "${{ matrix.numpy }}" "${{ matrix.scipy }}" "${{ matrix.matplotlib }}"
          python -m pip check
      - name: Report resolved versions
        run: |
          python -c "import numpy, scipy, matplotlib; print('numpy', numpy.__version__); print('scipy', scipy.__version__); print('matplotlib', matplotlib.__version__)"
      - name: Run tests
        run: |
          pytest tests/ -v --tb=short -m "not docs"

  docs:
    # Execute every docs code block and the demo notebook, then build the
    # Sphinx site with warnings as errors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs]" nbclient nbformat ipykernel
      - name: Run docs code blocks and the demo notebook
        run: |
          pytest tests/ -m docs -v --tb=short
      - name: Build docs (warnings are errors)
        run: |
          sphinx-build -b html -W --keep-going docs docs/_build/html

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check import sorting
        run: |
          pip install isort
          isort --check-only --diff phased_array/

      - name: Lint (ruff, config in pyproject.toml)
        run: |
          pip install ruff
          ruff check phased_array/ tests/

  typecheck:
    # Informational until the existing type errors are cleared: the step
    # may fail without failing the job; errors are listed in its log
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: mypy (informational)
        continue-on-error: true
        run: |
          python -m pip install -e . mypy
          mypy
